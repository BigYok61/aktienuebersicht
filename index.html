<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aktienübersicht</title>
<meta name="description" content="Aktienübersicht – Watchlist mit Kursen, Prognosen, Dividenden und Kurszielen">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Aktien">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=16">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" class="card">
    <img src="icons/icon.svg" alt="" width="64" height="64">
    <h1>Aktienübersicht</h1>
    <p class="sub">Die Daten sind verschlüsselt. Bitte Passwort eingeben.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Passwort" required>
    <label class="chk"><input id="remember" type="checkbox"> Passwort merken (auf diesem Gerät)</label>
    <button type="submit" id="loginBtn">Entsperren</button>
    <p id="loginErr" class="error" hidden></p>
  </form>
</div>

<div id="app" hidden>
<aside id="sidebar">
  <div class="sbtop">
    <div class="sbtitle"><h1>Aktien</h1>
      <div class="tools"><button id="editBtn" type="button" title="Watchlist bearbeiten">Bearbeiten</button><button id="depotBtn" type="button" title="Depot (verschlüsselt im Repo, auf allen Geräten gleich)">Depot</button><button id="reload" type="button" aria-label="Aktualisieren" title="Aktualisieren">↻</button></div></div>
    <input id="search" type="search" placeholder="🔍 Aktien" autocomplete="off" aria-label="Watchlist durchsuchen">
    <div class="sbopts">
      <select id="sort" aria-label="Sortierung" title="Sortierung">
        <option value="cat">Nach Kategorie</option><option value="alpha">Alphabetisch (Ticker)</option><option value="name">Alphabetisch (Name)</option>
        <option value="chg">Nach Tagesveränderung</option><option value="manual">Eigene Reihenfolge</option>
      </select>
      <select id="colSel" aria-label="Prognose-Spalten" title="Spalten rechts vom Kurs: eigene Prognosen (7 T., 3 M., 12 M.) und Experten-Kursziele"><option value="all">Eigene + Experten</option><option value="own">Eigene Prognosen</option><option value="exp">Experten</option><option value="none">Keine Spalten</option></select>
      <select id="sparkSel" aria-label="Zeitraum der Mini-Charts" title="Zeitraum der Mini-Charts"><option value="1T">1 T.</option><option value="5T">5 T.</option><option value="1M">1 M.</option><option value="1J">1 J.</option></select>
    </div>
  </div>
  <ul id="list" class="list"></ul>
  <div class="sbfoot"><span id="stand">Lade …</span> · <span id="updated"></span><br><a href="#" id="csv">CSV</a> · <a href="#" id="logout">Abmelden</a></div>
</aside>
<div id="main">
  <div class="toolbar"><button class="back" id="backOv" type="button">‹ Liste</button><span class="sp"></span></div>
  <div id="error" class="error" hidden></div>
  <section id="editor" class="panel" hidden></section>
  <section id="detail"></section>
  <section id="emptyMain" class="panel" hidden><p class="sub">Die Watchlist ist leer. Titel unter „Bearbeiten“ hinzufügen.</p></section>
</div>
</div>

<dialog id="depot"></dialog>
<script src="app.js?v=16"></script>
</body>
</html>
